name = "voice-vibes"
main = "dist/worker.js"
compatibility_date = "2026-08-11"

# ⚠️ SECRETS POLICY — READ THIS
# DISCORD_CLIENT_SECRET is NOT stored in this repo. It lives as an encrypted
# Cloudflare Worker secret (set by deploy.sh from the environment variable).
# Never commit real secret values here.

[vars]
# Discord OAuth (confidential client) — client ID is public.
# Set to your Discord Application ID from https://discord.com/developers
DISCORD_CLIENT_ID = "YOUR_DISCORD_CLIENT_ID"
# IMPORTANT: must match the redirect URI registered in the Discord
# Developer Portal EXACTLY (no trailing slash).
REDIRECT_URI = "https://voice-vibes.walusimbileon2.workers.dev"

# Firebase Realtime Database (shared, public-writable — same DB as Bible Trivia)
FB_HOST = "bible-game-21-default-rtdb.firebaseio.com"
